name: One-off actual prescription PDF

on:
  push:
    branches: [tmp/actual-rx-pdf-20261006]

permissions:
  contents: read

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test runner dependencies
        run: npm ci

      - name: Download exact v2.0.4 release installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/kshohanservice-glitch/Dentiva-Windows-Application/releases/download/v2.0.4/DentivaPro-Setup-2.0.4.exe" -OutFile "$env:RUNNER_TEMP\DentivaPro-Setup-2.0.4.exe"

      - name: Install exact v2.0.4 release
        shell: pwsh
        run: |
          $installDir = "$env:RUNNER_TEMP\dentiva-v204"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\DentivaPro-Setup-2.0.4.exe" -ArgumentList "/S", "/D=$installDir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $exe = "$installDir\Dentiva Pro.exe"
          if (!(Test-Path $exe)) { throw "Installed executable missing: $exe" }
          "DENTIVA_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Drive the real app and save its prescription PDF
        shell: pwsh
        run: node scripts/generate-actual-rx-pdf.mjs

      - name: Upload the PDF generated by Dentiva Pro v2.0.4
        uses: actions/upload-artifact@v4
        with:
          name: dentiva-v2.0.4-actual-prescription-pdf
          path: dentiva-v2.0.4-actual-prescription.pdf
          if-no-files-found: error
          retention-days: 1
